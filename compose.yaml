services:
  database:
    image: postgres:18
    container_name: presentation-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=presentationdb
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - bridge
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d presentationdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    container_name: migrate
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    secrets:
      - db_connection_url
    # 從 secret 檔案讀取 postgres:// URL 後執行 migrate up
    entrypoint: ["/bin/sh", "-c"]
    command: ["/migrate -path=/migrations -database=\"$(cat /run/secrets/db_connection_url)\" up"]
    networks:
      - bridge
    restart: on-failure

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=admin
    ports:
      - "8080:80"    # Web UI → http://localhost:8080
      - "5341:5341"  # Ingest endpoint
    volumes:
      - seq_data:/data
    networks:
      - bridge

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - bridge
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Presentation.WebApi/Dockerfile
#    image: minqq/presentation.webapi:latest
    container_name: backend
    depends_on:
#      migrate:
#        condition: service_completed_successfully
      seq:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Taipei
      - ASPNETCORE_URLS=http://+:5230
      - ConnectionStrings__DefaultConnectionFile=/run/secrets/db_connection
      - Discord__BotTokenFile=/run/secrets/discord_bot_token
      - Discord__ClientId=836636705498595340
      - Discord__ClientSecretFile=/run/secrets/discord_client_secret
      - Discord__RedirectUri=https://maplestory.paralleluniversegame.uk/callback
      - Jwt__SecretKeyFile=/run/secrets/jwt_secret_key
      - Jwt__Issuer=https://maplestory.paralleluniversegame.uk
      - Jwt__Audience=https://maplestory.paralleluniversegame.uk
      - Seq__ServerUrl=http://seq:5341
      - Redis__Configuration=redis:6379
      - MicrosoftMail__TenantId=consumers
      - MicrosoftMail__ClientId=8dd473dc-86d4-441b-8e66-99ee810c74b3
      - MicrosoftMail__RefreshTokenFile=/run/secrets/microsoft_mail_refresh_token
      - MicrosoftMail__ToAddress=jeremywsm@gmail.com
      - MicrosoftMail__WebhookSecretFile=/run/secrets/microsoft_mail_webhook_secret
      - Sentry__DsnFile=/run/secrets/sentry_dsn
      - Sentry__DiscordIdHashKeyFile=/run/secrets/discord_hash_key
    secrets:
      - db_connection
      - discord_bot_token
      - discord_client_secret
      - jwt_secret_key
      - microsoft_mail_refresh_token
      - microsoft_mail_webhook_secret
      - sentry_dsn
      - discord_hash_key
    expose:
      - "5230"
    networks:
      - bridge

  frontend:
    build:
      context: ./web
#    image: minqq/frontend:latest
    environment:
      - NEXT_PUBLIC_APP_URL=https://maplestory.paralleluniversegame.uk
      - BACKEND_API_URL=http://backend:5230
      - NEXT_PUBLIC_DISCORD_CLIENT_ID=836636705498595340
    container_name: frontend
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - bridge

  bot:
    build:
      context: .
      dockerfile: Presentation/Dockerfile
#    image: minqq/presentation:latest
    container_name: bot
    depends_on:
#      migrate:
#        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnectionFile=/run/secrets/db_connection
      - Discord__BotTokenFile=/run/secrets/discord_bot_token
      - App__AppUrl=https://maplestory.paralleluniversegame.uk
      - Redis__Configuration=redis:6379
      - Seq__ServerUrl=http://seq:5341
    secrets:
      - db_connection
      - discord_bot_token
    networks:
      - bridge

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    depends_on:
      - frontend
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    networks:
      - bridge

secrets:
  db_connection:
    file: ./secrets/db_connection.txt
  db_connection_url:
    # postgres:// URL 格式，供 golang-migrate 使用
    # 範例：postgres://postgres:PASSWORD@database:5432/presentationdb?sslmode=disable
    file: ./secrets/db_connection_url.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  discord_bot_token:
    file: ./secrets/discord_bot_token.txt
  discord_client_secret:
    file: ./secrets/discord_client_secret.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  cloudflared_token:
    file: ./secrets/cloudflared_token.txt
  microsoft_mail_refresh_token:
    file: ./secrets/microsoft_mail_refresh_token.txt
  microsoft_mail_webhook_secret:
    file: ./secrets/microsoft_mail_webhook_secret.txt
  sentry_dsn:
    # sentry.io 建立 Project 後才會給值，拿到前是空檔案（見 Program.cs 的 Sentry:DsnFile 判斷）
    file: ./secrets/sentry_dsn.txt
  discord_hash_key:
    # DiscordId 送 Sentry 前的 HMAC 密鑰（見 plans/2026-08-04-sentry-discordid-hmac.md）
    file: ./secrets/discord_hash_key.txt

networks:
  bridge:
    driver: bridge

volumes:
  db_data:
  seq_data:
