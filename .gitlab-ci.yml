# 自架 GitLab CI：build → 單元/整合測試（收覆蓋率）→ 合併覆蓋率
stages:
  - build
  - test
  - coverage
  - e2e

default:
  image: mcr.microsoft.com/dotnet/sdk:9.0

variables:
  # NuGet 套件裝到專案內，方便 GitLab cache 撈得到
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

# 整個 solution 編得過（含 Presentation，測試專案未必涵蓋）
build:
  stage: build
  script:
    - dotnet restore
    - dotnet build --no-restore -c Release
  cache:
    key: nuget
    paths: [.nuget/packages]

# 純邏輯，不需要 Docker；收覆蓋率存 artifact 給 coverage job 合併
unit-test:
  stage: test
  script:
    - dotnet test Test/Test.csproj -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage-unit
  cache:
    key: nuget
    paths: [.nuget/packages]
    policy: pull
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - coverage-unit/**/coverage.cobertura.xml

# 打真 Postgres（Testcontainers）→ docker-in-docker；收覆蓋率存 artifact
integration-test:
  stage: test
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    # Testcontainers 要透過 dind host「docker」連容器映射的 port，不是 localhost
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    # dind 裡 Ryuk 清理容器常起不來，關掉（job 結束 dind 整個銷毀即清乾淨）
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - dotnet test Test.Integration/Test.Integration.csproj -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage-integration
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - coverage-integration/**/coverage.cobertura.xml

# 合併 unit + integration 兩份覆蓋率 → 一份總報告（取聯集，不重複計）
coverage:
  stage: coverage
  needs: [unit-test, integration-test]   # 自動抓這兩個 job 的 artifact
  script:
    - dotnet tool install -g dotnet-reportgenerator-globaltool
    - export PATH="$PATH:/root/.dotnet/tools"
    - reportgenerator -reports:"coverage-unit/**/coverage.cobertura.xml;coverage-integration/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"TextSummary;Cobertura"
    - cat coverage-report/Summary.txt
  # 從 log 抓總行覆蓋率，顯示在 pipeline/MR 上
  coverage: '/Line coverage: \d+(?:\.\d+)?%/'
  artifacts:
    expire_in: 1 week
    paths:
      - coverage-report/
    reports:
      # 讓 GitLab 在 MR diff 標行覆蓋
      coverage_report:
        coverage_format: cobertura
        path: coverage-report/Cobertura.xml

# E2E（Playwright 打全 stack：db + backend + frontend）——重，預設手動觸發。
# 全在 compose.e2e.yaml，job 只用 dind 起它。核心機制（全 stack + 容器內 playwright）本機已驗證綠。
e2e:
  stage: e2e
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    COMPOSE_PROJECT_NAME: e2e
    E2E_REGISTRY: "$CI_REGISTRY_IMAGE"   # compose 的 image: 用這個前綴引用預建映像
  when: manual          # E2E 重（起全 stack），opt-in
  script:
    # buildx docker-container driver（才能 registry cache export）+ 登入 GitLab Registry
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --driver docker-container --use --name e2e 2>/dev/null || docker buildx use e2e
    # 預建 3 映像：registry layer cache（dotnet restore / npm ci 未變就命中跳過）→ --load 進 dind
    - |
      C="type=registry,ref=$CI_REGISTRY_IMAGE/cache"
      docker buildx build --cache-from ${C}/backend    --cache-to ${C}/backend,mode=max    --load -t $E2E_REGISTRY/backend:latest    -f Presentation.WebApi/Dockerfile .
      docker buildx build --cache-from ${C}/frontend   --cache-to ${C}/frontend,mode=max   --load -t $E2E_REGISTRY/frontend:latest   --target dev ./web
      docker buildx build --cache-from ${C}/playwright --cache-to ${C}/playwright,mode=max --load -t $E2E_REGISTRY/playwright:latest -f web/Dockerfile.e2e ./web
    # 起 stack（用預建映像，不再 --build）
    - docker compose -f compose.e2e.yaml up -d e2e-frontend
    # 等 backend 的 WeeklyPeriodJob 建好 period（有 period 才代表 backend 起完）→ seed 再蓋掉它
    - |
      until [ "$(docker compose -f compose.e2e.yaml exec -T e2e-db sh -c 'PGPASSWORD=e2e psql -U postgres -d presentationdb -tAc "SELECT count(*) FROM \"Period\""' 2>/dev/null | tr -dc 0-9)" -ge 1 ] 2>/dev/null; do
        echo "等 backend 建 period..."; sleep 3;
      done
    # 灌 E2E seed（單一未來 period + 三隻獨立王）
    - docker compose -f compose.e2e.yaml exec -T e2e-db sh -c 'PGPASSWORD=e2e psql -U postgres -d presentationdb' < db/seed-e2e.sql
    # 在 compose 內跑 Playwright（共用 frontend netns → localhost:3000）；exit code = 測試結果
    - docker compose -f compose.e2e.yaml --profile ci run --rm e2e-playwright
  after_script:
    - docker compose -f compose.e2e.yaml --profile ci down -v || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - web/playwright-report/
