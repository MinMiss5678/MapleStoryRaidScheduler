# 自架 GitLab CI：build → 單元/整合測試（收覆蓋率）→ 合併覆蓋率

# 純文件變動（*.md / docs / plans / LICENSE）不觸發整條 pipeline，省 CI 資源。
# 手動 / web / API / 排程觸發一律照跑（方便強制重跑）；push 只有動到程式碼相關檔才跑。
# 想手動略過某次 push 也可在 commit 訊息加 [skip ci]（GitLab 原生支援）。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.cs"
        - "**/*.csproj"
        - "**/*.sln"
        - "web/**/*"
        - "db/**/*"
        - "k8s/**/*"
        - "**/Dockerfile*"
        - "compose*.yaml"
        - ".gitlab-ci.yml"
        - "secrets/**/*"
    - when: never

stages:
  - build
  - test
  - coverage
  - e2e
  - deploy

default:
  image: mcr.microsoft.com/dotnet/sdk:9.0

variables:
  # NuGet 套件裝到專案內，方便 GitLab cache 撈得到
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

# 整個 solution 編得過（含 Presentation，測試專案未必涵蓋）
build:
  stage: build
  script:
    - dotnet restore
    - dotnet build --no-restore -c Release
  cache:
    key: nuget
    paths: [.nuget/packages]

# 純邏輯，不需要 Docker；收覆蓋率存 artifact 給 coverage job 合併
unit-test:
  stage: test
  script:
    - dotnet test Test/Test.csproj -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage-unit
  cache:
    key: nuget
    paths: [.nuget/packages]
    policy: pull
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - coverage-unit/**/coverage.cobertura.xml

# 打真 Postgres（Testcontainers）→ docker-in-docker；收覆蓋率存 artifact
integration-test:
  stage: test
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    # Testcontainers 要透過 dind host「docker」連容器映射的 port，不是 localhost
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    # dind 裡 Ryuk 清理容器常起不來，關掉（job 結束 dind 整個銷毀即清乾淨）
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - dotnet test Test.Integration/Test.Integration.csproj -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage-integration
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - coverage-integration/**/coverage.cobertura.xml

# 合併 unit + integration 兩份覆蓋率 → 一份總報告（取聯集，不重複計）
coverage:
  stage: coverage
  needs: [unit-test, integration-test]   # 自動抓這兩個 job 的 artifact
  script:
    - dotnet tool install -g dotnet-reportgenerator-globaltool
    - export PATH="$PATH:/root/.dotnet/tools"
    - reportgenerator -reports:"coverage-unit/**/coverage.cobertura.xml;coverage-integration/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"TextSummary;Cobertura"
    - cat coverage-report/Summary.txt
  # 從 log 抓總行覆蓋率，顯示在 pipeline/MR 上
  coverage: '/Line coverage: \d+(?:\.\d+)?%/'
  artifacts:
    expire_in: 1 week
    paths:
      - coverage-report/
    reports:
      # 讓 GitLab 在 MR diff 標行覆蓋
      coverage_report:
        coverage_format: cobertura
        path: coverage-report/Cobertura.xml

# E2E（Playwright 打全 stack：db + backend + frontend）——重，coverage 全過後自動觸發。
# 全在 compose.e2e.yaml，job 只用 dind 起它。核心機制（全 stack + 容器內 playwright）本機已驗證綠。
e2e:
  stage: e2e
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    COMPOSE_PROJECT_NAME: e2e
    E2E_REGISTRY: "$CI_REGISTRY_IMAGE"   # compose 的 image: 用這個前綴引用預建映像
  script:
    # buildx docker-container driver（才能 registry cache export）+ 登入 GitLab Registry
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # dind+TLS 下 buildx 無法直接從 env 讀 TLS → 先建 docker context 包 TLS，再用它建 docker-container builder
    - docker context create e2e-ctx --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    # network=host：buildkit 容器用 dind 的 host 網路，RUN 步驟（dotnet restore / npm ci）才連得到對外
    - docker buildx create --use --bootstrap --name e2e --driver-opt network=host e2e-ctx
    # 預建 3 映像：registry layer cache（dotnet restore / npm ci 未變就命中跳過）→ --load 進 dind
    - |
      C="type=registry,ref=$CI_REGISTRY_IMAGE/cache"
      docker buildx build --cache-from ${C}/backend    --cache-to ${C}/backend,mode=max    --load -t $E2E_REGISTRY/backend:latest    -f Presentation.WebApi/Dockerfile .
      docker buildx build --cache-from ${C}/frontend   --cache-to ${C}/frontend,mode=max   --load -t $E2E_REGISTRY/frontend:latest   --target dev ./web
      docker buildx build --cache-from ${C}/playwright --cache-to ${C}/playwright,mode=max --load -t $E2E_REGISTRY/playwright:latest -f web/Dockerfile.e2e ./web
    # 起 stack（用預建映像，不再 --build）
    - docker compose -f compose.e2e.yaml up -d e2e-frontend
    # 等 backend /health/ready = 200（backend 起完 + DB 連得到；migrations 已跑，因 e2e-backend
    # depends_on e2e-migrate: service_completed_successfully）。比輪詢 Period 更直接、且不綁 WeeklyPeriodJob。
    # 用 e2e-frontend(node) 在 compose 網路內 fetch backend 的 readiness 探針（沿用本檔 e2e-playwright 的 node fetch 等待 pattern）。
    - |
      until docker compose -f compose.e2e.yaml exec -T e2e-frontend node -e "fetch('http://e2e-backend:5230/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; do
        echo "等 backend /health/ready..."; sleep 3;
      done
    # 灌 E2E seed（單一未來 period + 三隻獨立王）
    - docker compose -f compose.e2e.yaml exec -T e2e-db sh -c 'PGPASSWORD=e2e psql -U postgres -d presentationdb' < db/seed-e2e.sql
    # 在 compose 內跑 Playwright（共用 frontend netns → localhost:3000）；--name 便於把報告 cp 出來
    - |
      docker compose -f compose.e2e.yaml --profile ci run --name e2e-pw e2e-playwright; RESULT=$?
      docker cp e2e-pw:/web/playwright-report ./web/playwright-report 2>/dev/null || true
      docker rm -f e2e-pw 2>/dev/null || true
      exit $RESULT   # exit code = 測試結果
  after_script:
    - docker compose -f compose.e2e.yaml --profile ci down -v || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - web/playwright-report/

# CD：build + push minqq/* → migrate → 滾動更新 k8s。CD 到 prod 一律「人工點擊」（when:manual），
# 只在 main。等同把 k8s/rollout.ps1 + migrate-job 搬進 CI。滾動更新時 readiness 探針會擋壞版本導流量。
#
# 需先在 GitLab CI/CD Variables 設（protected + masked）：
#   DOCKERHUB_USER / DOCKERHUB_TOKEN   推 minqq/* 到 Docker Hub（k8s 從這拉映像）
#   KUBECONFIG_B64                     base64 過的 kubeconfig（`base64 -w0 ~/.kube/config`）→ 讓 CI 連得到叢集
deploy:
  stage: deploy
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual        # 只在 main、且需人工點擊才部署
  script:
    # buildx（docker-container driver + network=host）——與 e2e job 同套路
    - docker context create cd-ctx --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use --bootstrap --name cd --driver-opt network=host cd-ctx
    # 登入：Docker Hub（推 minqq/*，k8s 從這拉）＋ GitLab Registry（存 layer cache，與 e2e 共用）
    - docker login -u "$DOCKERHUB_USER" -p "$DOCKERHUB_TOKEN"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # build + push 4 個映像（backend/frontend 走 registry layer cache；frontend 用 prod 目標，非 e2e 的 dev）
    - |
      C="type=registry,ref=$CI_REGISTRY_IMAGE/cache"
      docker buildx build --cache-from ${C}/backend  --cache-to ${C}/backend,mode=max  --push -t minqq/presentation.webapi:latest -f Presentation.WebApi/Dockerfile .
      docker buildx build --cache-from ${C}/frontend --cache-to ${C}/frontend,mode=max --push -t minqq/frontend:latest           -f web/Dockerfile ./web
      docker buildx build --push -t minqq/presentation:latest -f Presentation/Dockerfile .
      docker buildx build --push -t minqq/migrate:latest      -f db/Dockerfile.migrate ./db
    # 安裝 kubectl + 載入 kubeconfig
    - apk add --no-cache curl
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
    - mkdir -p ~/.kube && echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
    # migration（Job spec immutable → 先刪舊 job 再套用，等它跑完才滾更新）
    - kubectl delete job migrate -n maple-raid --ignore-not-found
    - kubectl apply -f k8s/migrate-job.yaml
    - kubectl wait --for=condition=complete job/migrate -n maple-raid --timeout=120s
    # 滾動更新三個服務（:latest + imagePullPolicy Always → 重啟即拉新映像）；readiness 綠才收舊 pod
    - kubectl rollout restart deployment/backend deployment/frontend deployment/bot -n maple-raid
    - kubectl rollout status deployment/backend  -n maple-raid --timeout=180s
    - kubectl rollout status deployment/frontend -n maple-raid --timeout=180s
    - kubectl rollout status deployment/bot      -n maple-raid --timeout=180s
