apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seq-data
  namespace: maple-raid
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
        - name: seq
          image: datalust/seq:latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SEQ_FIRSTRUN_ADMINPASSWORD
              value: admin
          ports:
            - containerPort: 80   # Web UI
            - containerPort: 5341 # Ingest
          # Seq 官方建議至少 1-2GB，這裡受限於 2GB 主機總預算，先給偏保守的上限——
          # 是目前所有服務裡最容易吃緊記憶體的一個，之後如果常態性頂到 512Mi 要考慮升級主機規格。
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          # 官方 /health endpoint 只在 UI port(80)上有回應，打 5341（ingest port）打不到
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: seq-data
              mountPath: /data
      volumes:
        - name: seq-data
          persistentVolumeClaim:
            claimName: seq-data
---
apiVersion: v1
kind: Service
metadata:
  name: seq
  namespace: maple-raid
spec:
  selector:
    app: seq
  ports:
    - name: ingest
      port: 5341
      targetPort: 5341
    - name: ui
      port: 80
      targetPort: 80
