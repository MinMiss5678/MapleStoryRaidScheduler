# Redis：重複提交防護的跨 pod 去重儲存。
# 刻意「無 PVC / 無持久化」——去重 key 是 60 秒 TTL 的短命標記，重啟掉了只是短暫重開雙擊窗口
# （backend 端 fail-open 也容忍 Redis 不可用），不值得為它掛 volume。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: maple-raid
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
