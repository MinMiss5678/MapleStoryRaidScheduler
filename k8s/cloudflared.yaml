apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          # --metrics 開啟後才有 /ready endpoint（cloudflared 官方 k8s 部署建議做法）
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: cloudflared_token
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          # /ready 回 200 代表已跟 Cloudflare edge 建立連線；readiness 拿掉流量、liveness 判死重啟
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
