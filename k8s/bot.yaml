apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
        - name: bot
          image: minqq/presentation:latest
          env:
            # session 撤銷跨 pod 生效：bot 撤 session 刪的是共享 Redis 快取（見 Presentation/Program.cs）
            - name: Redis__Configuration
              value: redis:6379
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: db_connection
            - name: Discord__BotToken
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: discord_bot_token
            - name: Discord__ChannelId
              value: "840590742270771223"
            - name: App__AppUrl
              value: https://maplestory.paralleluniversegame.uk
            - name: Seq__ServerUrl
              value: http://seq:5341
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
