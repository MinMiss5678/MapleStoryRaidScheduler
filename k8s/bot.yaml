apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
        - name: bot
          image: minqq/presentation:latest
          env:
            # session 撤銷跨 pod 生效：bot 撤 session 刪的是共享 Redis 快取（見 Presentation/Program.cs）
            - name: Redis__Configuration
              value: redis:6379
            # secret 改檔案交付（volume mount /etc/maple-secrets，見 plans/2026-08-25-k8s-secrets-file-mount.md）
            - name: ConnectionStrings__DefaultConnectionFile
              value: /etc/maple-secrets/db_connection
            - name: Discord__BotTokenFile
              value: /etc/maple-secrets/discord_bot_token
            - name: Discord__ChannelId
              value: "840590742270771223"
            # DM 發送（leader-led 通知）走 GetGuildAsync(GuildId).GetMemberAsync → bot 也要 GuildId。
            # 缺這行 → Convert.ToUInt64("") 丟例外 → outbox 無限重試、DM 送不出（backend 有、bot 漏了）。
            - name: Discord__GuildId
              value: "840590742270771220"
            - name: App__AppUrl
              value: https://maplestory.paralleluniversegame.uk
            - name: Seq__ServerUrl
              value: http://seq:5341
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
          # secret 檔案交付：maple-secrets 整包掛成唯讀檔於 /etc/maple-secrets（不用 /run/secrets，見 backend.yaml 註解：撞 serviceaccount 掛載）。
          volumeMounts:
            - name: secrets
              mountPath: /etc/maple-secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: maple-secrets
            defaultMode: 0444   # r--r--r--：非 root container 也讀得到（decision 5）
            # 整包掛（不用 items）：maple-secrets 現有 key 變成檔；缺選填 key 不會炸（見 backend.yaml 註解）。
