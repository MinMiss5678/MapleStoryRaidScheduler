apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: minqq/presentation.webapi:latest
          env:
            - name: TZ
              value: Asia/Taipei
            - name: ASPNETCORE_URLS
              value: http://+:5230
            - name: Redis__Configuration
              value: redis:6379
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: db_connection
            - name: Discord__BotToken
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: discord_bot_token
            - name: Discord__ClientId
              value: "836636705498595340"
            - name: Discord__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: discord_client_secret
            - name: Discord__RedirectUri
              value: https://maplestory.paralleluniversegame.uk/callback
            - name: Discord__GuildId
              value: "840590742270771220"
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: jwt_secret_key
            - name: Jwt-Issuer
              value: https://maplestory.paralleluniversegame.uk
            - name: Jwt-Audience
              value: https://maplestory.paralleluniversegame.uk
            - name: Seq__ServerUrl
              value: http://seq:5341
            # Seq Alert 錯誤通知信（見 plans/2026-07-31-error-alerting.md、docs/microsoft-mail-oauth2-setup.md）。
            # optional: true——這是錦上添花的通知功能，secret 還沒設定時不該讓 pod 啟動失敗。
            - name: MicrosoftMail__TenantId
              value: consumers
            - name: MicrosoftMail__ClientId
              value: 8dd473dc-86d4-441b-8e66-99ee810c74b3
            - name: MicrosoftMail__RefreshToken
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: microsoft_mail_refresh_token
                  optional: true
            - name: MicrosoftMail__ToAddress
              value: jeremywsm@gmail.com
            - name: MicrosoftMail__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: microsoft_mail_webhook_secret
                  optional: true
          ports:
            - containerPort: 5230
          # liveness：只看 app 活著（不查 DB）→ DB 掛不會誤殺 pod
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5230
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness：查 DB → DB 沒好時停止導流量（但不重啟 pod），恢復後自動放回
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5230
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: maple-raid
spec:
  selector:
    app: backend
  ports:
    - port: 5230
      targetPort: 5230
