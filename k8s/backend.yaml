apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: minqq/presentation.webapi:latest
          env:
            - name: TZ
              value: Asia/Taipei
            - name: ASPNETCORE_URLS
              value: http://+:5230
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: db_connection
            - name: Discord__BotToken
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: discord_bot_token
            - name: Discord__ClientId
              value: "836636705498595340"
            - name: Discord__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: discord_client_secret
            - name: Discord__RedirectUri
              value: https://maplestory.paralleluniversegame.uk/callback
            - name: Discord__GuildId
              value: "840590742270771220"
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: jwt_secret_key
            - name: Jwt-Issuer
              value: https://maplestory.paralleluniversegame.uk
            - name: Jwt-Audience
              value: https://maplestory.paralleluniversegame.uk
            - name: Seq__ServerUrl
              value: http://seq:5341
          ports:
            - containerPort: 5230
          # liveness：只看 app 活著（不查 DB）→ DB 掛不會誤殺 pod
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5230
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness：查 DB → DB 沒好時停止導流量（但不重啟 pod），恢復後自動放回
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5230
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: maple-raid
spec:
  selector:
    app: backend
  ports:
    - port: 5230
      targetPort: 5230
