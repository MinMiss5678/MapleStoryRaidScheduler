apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: minqq/presentation.webapi:latest
          env:
            - name: TZ
              value: Asia/Taipei
            - name: ASPNETCORE_URLS
              value: http://+:5230
            - name: Redis__Configuration
              value: redis:6379
            # secret 改檔案交付（volume mount /etc/maple-secrets，見 plans/2026-08-25-k8s-secrets-file-mount.md）
            - name: ConnectionStrings__DefaultConnectionFile
              value: /etc/maple-secrets/db_connection
            - name: Discord__BotTokenFile
              value: /etc/maple-secrets/discord_bot_token
            - name: Discord__ClientId
              value: "836636705498595340"
            - name: Discord__ClientSecretFile
              value: /etc/maple-secrets/discord_client_secret
            - name: Discord__RedirectUri
              value: https://maplestory.paralleluniversegame.uk/callback
            - name: Discord__GuildId
              value: "840590742270771220"
            - name: App__AppUrl
              value: https://maplestory.paralleluniversegame.uk
            - name: Jwt__SecretKeyFile
              value: /etc/maple-secrets/jwt_secret_key
            - name: Jwt__Issuer
              value: https://maplestory.paralleluniversegame.uk
            - name: Jwt__Audience
              value: https://maplestory.paralleluniversegame.uk
            - name: Seq__ServerUrl
              value: http://seq:5341
            # Seq Alert 錯誤通知信（見 plans/2026-07-31-error-alerting.md、docs/microsoft-mail-oauth2-setup.md）。
            # optional: true——這是錦上添花的通知功能，secret 還沒設定時不該讓 pod 啟動失敗。
            - name: MicrosoftMail__TenantId
              value: consumers
            - name: MicrosoftMail__ClientId
              value: 8dd473dc-86d4-441b-8e66-99ee810c74b3
            # 空值 secret（未設定）掛成空檔 → code 讀到空字串即視為未設定（同原 optional 語意）
            - name: MicrosoftMail__RefreshTokenFile
              value: /etc/maple-secrets/microsoft_mail_refresh_token
            - name: MicrosoftMail__ToAddress
              value: jeremywsm@gmail.com
            - name: MicrosoftMail__WebhookSecretFile
              value: /etc/maple-secrets/microsoft_mail_webhook_secret
            # sentry.io 錯誤追蹤（見 plans/2026-08-03-bugsink-integration.md）：optional——
            # 沒設定就不掛 Sentry sink（見 Program.cs 的 Sentry:Dsn 判斷），不該讓 pod 啟動失敗。
            - name: Sentry__DsnFile
              value: /etc/maple-secrets/sentry_dsn
            # DiscordId 送 Sentry 前的 HMAC 密鑰（見 plans/2026-08-04-sentry-discordid-hmac.md）：
            # optional——沒設就不送 DiscordId tag（BeforeSend 判斷），不該讓 pod 啟動失敗。
            - name: Sentry__DiscordIdHashKeyFile
              value: /etc/maple-secrets/discord_hash_key
          ports:
            - containerPort: 5230
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          # liveness：只看 app 活著（不查 DB）→ DB 掛不會誤殺 pod
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5230
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness：查 DB → DB 沒好時停止導流量（但不重啟 pod），恢復後自動放回
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5230
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # secret 檔案交付：maple-secrets 整包掛成唯讀檔於 /etc/maple-secrets。
          # 不用 /run/secrets：k8s 的 serviceaccount token 掛在 /var/run/secrets/kubernetes.io（=/run/secrets 底下），
          # 唯讀掛 /run/secrets 會擋掉那個 mountpoint → 容器 RunContainerError 起不來（compose 用 /run/secrets 無此問題）。
          volumeMounts:
            - name: secrets
              mountPath: /etc/maple-secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: maple-secrets
            defaultMode: 0444   # r--r--r--：非 root container 也讀得到（decision 5）
            # 整包掛（不用 items）：只把 maple-secrets 現有的 key 變成檔。選填 secret（sentry/mail/hash）
            # 若沒建該 key → 沒那個檔 → code 讀不到當未設定、pod 照起（items 逐 key 挑會因缺 key 掛載失敗、pod 起不來）。
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: maple-raid
spec:
  selector:
    app: backend
  ports:
    - port: 5230
      targetPort: 5230
