apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: maple-raid
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: maple-raid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: presentationdb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: postgres_password
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "presentationdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          # exit 1（拒絕連線中，如剛啟動/smart shutdown）也算活著，只有 exit 2/3（真的連不上）才判死重啟——
          # k8s exec probe 只認 exit 0 為成功，故用 shell 包一層放寬判斷
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d presentationdb; ec=$?; [ \"$ec\" -eq 0 ] || [ \"$ec\" -eq 1 ]"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: maple-raid
spec:
  selector:
    app: database
  ports:
    - port: 5432
      targetPort: 5432
