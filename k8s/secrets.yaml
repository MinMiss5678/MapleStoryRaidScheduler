# 請勿將真實值提交至 git！
#
# 步驟 1 — 建立 secrets/ 資料夾並填入值（secrets/ 已在 .gitignore）：
#
#   mkdir secrets
#   echo -n "Host=database;Database=presentationdb;Username=postgres;Password=YOUR_PW" > secrets/db_connection.txt
#   echo -n "postgres://postgres:YOUR_PW@database:5432/presentationdb?sslmode=disable" > secrets/db_connection_url.txt
#   echo -n "YOUR_PW"                  > secrets/postgres_password.txt
#   echo -n "YOUR_BOT_TOKEN"           > secrets/discord_bot_token.txt
#   echo -n "YOUR_CLIENT_SECRET"       > secrets/discord_client_secret.txt
#   echo -n "YOUR_JWT_SECRET_32CHARS"  > secrets/jwt_secret_key.txt
#   echo -n "YOUR_CLOUDFLARED_TOKEN"   > secrets/cloudflared_token.txt
#
# 步驟 2 — 建立 K8s Secret：
#
#   kubectl create secret generic maple-secrets -n maple-raid `
#     --from-file=db_connection=./secrets/db_connection.txt `
#     --from-file=db_connection_url=./secrets/db_connection_url.txt `
#     --from-file=postgres_password=./secrets/postgres_password.txt `
#     --from-file=discord_bot_token=./secrets/discord_bot_token.txt `
#     --from-file=discord_client_secret=./secrets/discord_client_secret.txt `
#     --from-file=jwt_secret_key=./secrets/jwt_secret_key.txt `
#     --from-file=cloudflared_token=./secrets/cloudflared_token.txt
apiVersion: v1
kind: Secret
metadata:
  name: maple-secrets
  namespace: maple-raid
type: Opaque
stringData:
  db_connection: "<Host=database;Database=presentationdb;Username=postgres;Password=CHANGE_ME>"
  db_connection_url: "<postgres://postgres:CHANGE_ME@database:5432/presentationdb?sslmode=disable>"
  postgres_password: "<CHANGE_ME>"
  discord_bot_token: "<CHANGE_ME>"
  discord_client_secret: "<CHANGE_ME>"
  jwt_secret_key: "<CHANGE_ME>"
  cloudflared_token: "<CHANGE_ME>"
