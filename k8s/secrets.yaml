# 請勿將真實值提交至 git！maple-secrets 由 secrets/*.txt 建立（步驟 1）→ 執行 k8s/setup-secrets.ps1（步驟 2）。
# 下方 stringData 只是「keys 參考 + 佔位模板」，勿直接 kubectl apply（會寫入 CHANGE_ME）。
#
# 步驟 1 — 建立 secrets/ 資料夾並填入值（secrets/ 已在 .gitignore）：
#
#   mkdir secrets
#   # ── 必填 ──
#   echo -n "Host=database;Database=presentationdb;Username=postgres;Password=YOUR_PW" > secrets/db_connection.txt
#   echo -n "YOUR_PW"                  > secrets/postgres_password.txt
#   echo -n "YOUR_BOT_TOKEN"           > secrets/discord_bot_token.txt
#   echo -n "YOUR_CLIENT_SECRET"       > secrets/discord_client_secret.txt
#   echo -n "YOUR_JWT_SECRET_32CHARS"  > secrets/jwt_secret_key.txt
#   echo -n "YOUR_CLOUDFLARED_TOKEN"   > secrets/cloudflared_token.txt
#   # ── 選填（沒有就別建該檔，setup-secrets.ps1 會自動跳過 → 對應功能關閉）──
#   echo -n "YOUR_MS_REFRESH_TOKEN"    > secrets/microsoft_mail_refresh_token.txt   # 錯誤通知信，見 docs/microsoft-mail-oauth2-setup.md
#   echo -n "YOUR_WEBHOOK_SECRET"      > secrets/microsoft_mail_webhook_secret.txt  # openssl rand -hex 32
#   echo -n "YOUR_SENTRY_DSN"          > secrets/sentry_dsn.txt                     # sentry.io 錯誤追蹤
#   echo -n "YOUR_HASH_KEY"            > secrets/discord_hash_key.txt               # DiscordId 送 Sentry 前的 HMAC 密鑰
#   # db_connection_url.txt 不用手建 → setup-secrets.ps1 從 postgres_password 自動產生。
#
# 步驟 2 — 建立 K8s Secret：執行  k8s/setup-secrets.ps1
#   （刪舊 Secret 重建、自動產 db_connection_url、選填檔缺省時自動跳過——比手打 kubectl --from-file 不易漏）
apiVersion: v1
kind: Secret
metadata:
  name: maple-secrets
  namespace: maple-raid
type: Opaque
stringData:
  db_connection: "<Host=database;Database=presentationdb;Username=postgres;Password=CHANGE_ME>"
  db_connection_url: "<postgres://postgres:CHANGE_ME@database:5432/presentationdb?sslmode=disable>"
  postgres_password: "<CHANGE_ME>"
  discord_bot_token: "<CHANGE_ME>"
  discord_client_secret: "<CHANGE_ME>"
  jwt_secret_key: "<CHANGE_ME>"
  cloudflared_token: "<CHANGE_ME>"
  microsoft_mail_refresh_token: ""
  microsoft_mail_webhook_secret: ""
  sentry_dsn: ""
  discord_hash_key: ""
