# E2E 專屬 dev-mode stack：測試 DB + migrate + backend(Development)。
# 前端由 Playwright webServer（next dev，跑在 host）經 BACKEND_API_URL=http://localhost:5230 連這裡的 backend。
# 起法：docker compose -f compose.e2e.yaml up -d --build
# 關鍵：backend 用 ASPNETCORE_ENVIRONMENT=Development → test-login 端點才有效（非 Production）。
services:
  e2e-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: presentationdb
    ports:
      - "5433:5432"   # 對外 5433，避免撞正式 compose 的 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d presentationdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  e2e-migrate:
    image: migrate/migrate
    depends_on:
      e2e-db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database"
      - "postgres://postgres:e2e@e2e-db:5432/presentationdb?sslmode=disable"
      - "up"

  e2e-backend:
    image: ${E2E_REGISTRY:-e2e}/backend:latest       # 本機由 build 產出並 tag；CI 預先 buildx 帶 cache 建好
    build:
      context: .                                    # Dockerfile 從方案根 COPY 各專案
      dockerfile: Presentation.WebApi/Dockerfile
    depends_on:
      e2e-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development          # ← test-login 端點只在非 Production 有效
      ASPNETCORE_URLS: http://+:5230
      ConnectionStrings__DefaultConnection: "Host=e2e-db;Port=5432;Database=presentationdb;Username=postgres;Password=e2e"
      Jwt__SecretKey: "e2e-testing-secret-key-not-for-production"   # ≥32 bytes（HMAC-SHA256 需要）
      Jwt__Issuer: "e2e"
      Jwt__Audience: "e2e"
      # Discord 不會被 test-login 用到，給 dummy 讓 DI 綁定得起來
      Discord__ClientId: "0"
      Discord__ClientSecret: "e2e"
      Discord__BotToken: "e2e"
    ports:
      - "5230:5230"

  # 前端 dev 模式（NODE_ENV=development → /api proxy 白名單含 test-login）；proxy 到 e2e-backend
  e2e-frontend:
    image: ${E2E_REGISTRY:-e2e}/frontend:latest
    build:
      context: ./web
      target: dev
    depends_on:
      e2e-backend:
        condition: service_started
    environment:
      BACKEND_API_URL: http://e2e-backend:5230
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

  # E2E 執行器（profile ci：本機 up 不啟動，CI 才跑）。在 compose 網路內連 e2e-frontend:3000。
  e2e-playwright:
    profiles: [ci]
    image: ${E2E_REGISTRY:-e2e}/playwright:latest
    build:
      context: ./web
      dockerfile: Dockerfile.e2e
    depends_on:
      e2e-frontend:
        condition: service_started
    # 共用 frontend 的網路命名空間 → 用 localhost:3000 存取前端（localhost 是 secure context，
    # crypto.randomUUID / Secure cookie 才正常，免掉 --unsafely-treat-insecure-origin flag）
    network_mode: "service:e2e-frontend"
    environment:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_NO_WEBSERVER: "1"
      CI: "1"
    command:
      - sh
      - -c
      - node -e "(async()=>{for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:3000');if(r.ok)break}catch(e){}await new Promise(r=>setTimeout(r,2000))}})()" && npx playwright test
