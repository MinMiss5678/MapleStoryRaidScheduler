name: CI

# PR 開/更新時跑完整驗證；push main（merge 後）再跑一次當守門。
# 純分支 push 不跑（沒開 PR 就沒 pull_request 事件）→ 不重複燒。
on:
  pull_request:
  push:
    branches: [main]

# 同一 PR/分支連續推 → 取消上一個還在跑的 run，省 runner 時間。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.x"
  # NuGet 套件裝進 workspace 內 → actions/cache 撈得到（比照原 GitLab NUGET_PACKAGES）
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # 純文件變更（docs/plans/根目錄 *.md）不用跑重量級 CI。下面每個 job 用
  # if: needs.changes.outputs.code == 'true' 條件跳過（不是在 on: 用 paths-ignore）：
  # paths-ignore 會讓 workflow 整個不觸發，required status checks 永遠等不到回報、PR 卡死；
  # 用 if 條件讓 job 本身跑但標記 skipped——GitHub 把 skipped 視為通過，required checks 照樣滿足。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # push 事件比對 before SHA 需要至少 2 層歷史
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!(docs/**|plans/**|**/*.md)'

  # Roslyn 靜態格式檢查（dotnet format）：未依 .editorconfig 格式化就擋 PR。
  # 本機修法：dotnet format（不帶 --verify-no-changes 即自動改）。
  format:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet restore
      - run: dotnet format --no-restore --verify-no-changes

  # 整個 solution 編得過（含 Presentation，測試專案未必涵蓋）
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

  # 純邏輯，不需要 Docker；收覆蓋率給 coverage job 合併
  unit-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet test Test/Test.csproj -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage-unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage-unit/**/coverage.cobertura.xml
          retention-days: 1

  # 打真 Postgres + Redis（Testcontainers）。ubuntu runner 內建 Docker daemon →
  # Testcontainers 直接用 host docker，免掉原 GitLab 的 dind / TLS / TESTCONTAINERS_HOST_OVERRIDE 那整套。
  integration-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet test Test.Integration/Test.Integration.csproj -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: coverage-integration/**/coverage.cobertura.xml
          retention-days: 1

  # 前端元件/單元測試（Vitest + React Testing Library）：渲染 + 互動 + mock API，測行為。
  frontend-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test:run
        working-directory: web

  # 合併 unit + integration 兩份覆蓋率 → 一份總報告（聯集，不重複計）
  coverage:
    needs: [changes, unit-test, integration-test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit
      - uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration
      - run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: |
          reportgenerator \
            -reports:"coverage-unit/**/coverage.cobertura.xml;coverage-integration/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"TextSummary;Cobertura;MarkdownSummaryGithub"
      - run: cat coverage-report/Summary.txt
      # 覆蓋率總結貼到 GitHub job summary（PR 頁可見）
      - run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 7

  # E2E（Playwright 打全 stack：db + redis + backend + frontend）。ubuntu runner 有 docker + compose v2，
  # 直接 compose build/up（預設 image tag e2e/*）→ 免掉原 GitLab 的 dind + buildx registry-cache context 那套。
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 建 e2e 映像
        run: docker compose -f compose.e2e.yaml --profile ci build
      - name: 起 stack
        run: docker compose -f compose.e2e.yaml up -d e2e-frontend
      # 等 backend /health/ready = 200（backend 起完 + DB 連得到 + migrations 已跑）。
      # 用 compose 網路內的 e2e-frontend(node) fetch backend readiness 探針。
      - name: 等 backend readiness
        run: |
          until docker compose -f compose.e2e.yaml exec -T e2e-frontend node -e "fetch('http://e2e-backend:5230/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; do
            echo "等 backend /health/ready..."; sleep 3;
          done
      - name: 灌 E2E seed
        run: docker compose -f compose.e2e.yaml exec -T e2e-db sh -c 'PGPASSWORD=e2e psql -U postgres -d presentationdb' < db/seed-e2e.sql
      - name: 跑 Playwright
        run: |
          docker compose -f compose.e2e.yaml --profile ci run --name e2e-pw e2e-playwright; RESULT=$?
          docker cp e2e-pw:/web/playwright-report ./web/playwright-report 2>/dev/null || true
          docker rm -f e2e-pw 2>/dev/null || true
          exit $RESULT
      - name: 收尾
        if: always()
        run: docker compose -f compose.e2e.yaml --profile ci down -v || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
