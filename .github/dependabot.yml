# 相依套件更新（SCA）：有已知漏洞或新版本時自動開 PR，走一般 CI（含 E2E）驗證後再合併。
# 每週一次、minor/patch 合成一個 PR，避免 PR 洪水；major 版本各自一個 PR（可能有破壞性變更，要個別看）。
# 資安更新（security updates）不受 schedule 限制，發現漏洞就立即開 PR。
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /Presentation.WebApi
      - /Presentation
      - /web
      - /db
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-base-images:
        update-types: [minor, patch]
